<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudioRemix - by Tama-ID</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#080810;color:#fff;min-height:100vh}
.app{max-width:440px;margin:auto;padding:14px 14px 80px}
.top{display:flex;justify-content:space-between;padding:6px 2px 14px}
.logo{font-weight:800;font-size:22px}.logo i{font-style:normal;background:linear-gradient(90deg,#a78bfa,#f472b6,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{background:#ffffff14;border:1px solid #ffffff25;padding:6px 11px;border-radius:99px;font-size:11px;font-weight:700}
.card{background:#ffffff10;border:1px solid #ffffff20;border-radius:26px;padding:14px}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;cursor:pointer}
.btn-dark{background:#1b1b2e;color:#fff;border:1px solid #ffffff22}
.btn-grad{background:linear-gradient(90deg,#38bdf8,#818cf8,#e879f9);color:#fff;margin-top:10px}
h3{font-size:14px;margin:18px 2px 8px}
.switch{width:48px;height:28px;background:#334155;border-radius:99px;position:relative;cursor:pointer}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%}
.switch.on{background:#22c55e}.switch.on::after{left:23px}
.eqGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-top:6px}
.eqCol{display:flex;flex-direction:column;align-items:center;gap:8px}
.eqCol span{font-size:10px;color:#cbd5e1}
.eqCol input{writing-mode:vertical-lr;direction:rtl;height:105px;width:18px;accent-color:#a78bfa}
.eqCol b{font-size:11px;color:#94a3b8}
.filterTrack{position:relative;height:38px;background:#0b0b18;border:1px solid #ffffff20;border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;font-weight:700;color:#94a3b8}
.filterKnob{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:28px;height:30px;background:#fff;border-radius:8px;cursor:grab}
/* === IPHONE KAYAK PUNYA DIA - 99% MIRIP === */
.iphone{
  position:relative;overflow:hidden;
  width:100%;max-width:330px;margin:0 auto;
  border-radius:38px;
  aspect-ratio:9/13.4;
  background:rgba(255,255,255,0.16);
  backdrop-filter:blur(35px) saturate(160%);-webkit-backdrop-filter:blur(35px) saturate(160%);
  border:1px solid rgba(255,255,255,0.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 25px 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column;padding:16px 16px 14px;
}
.iphoneBg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(35px) brightness(.55) saturate(1.4);z-index:0}
.iphone>*{position:relative;z-index:2}
.cover{
  border-radius:14px;overflow:hidden;aspect-ratio:1/1;
  background:#6b7280;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}
.cover img{width:100%;height:100%;object-fit:cover;display:none}
.cover .ph{font-size:11px;color:#fff;opacity:.8;text-align:center}
.playerInfo{display:flex;align-items:center;gap:10px;margin-top:16px;padding:0 2px}
.playerInfo .txt{flex:1;min-width:0}
.playerInfo .title{font-size:14.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playerInfo .artist{font-size:13.5px;font-weight:500;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.vizMini{width:34px;height:20px;flex-shrink:0}
.timeRow{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.75);margin:12px 2px 0}
.progress{height:4px;background:rgba(255,255,255,.3);border-radius:99px;margin:6px 2px 0;overflow:hidden}
#prog{height:100%;width:0%;background:#fff;border-radius:99px}
.iphoneControls{display:flex;align-items:center;justify-content:center;gap:32px;padding:14px 0 2px}
.iphoneControls button{background:transparent;border:0;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.iphoneControls svg{display:block}
.volRow{display:flex;align-items:center;gap:10px;padding:14px 2px 0;width:100%}
.volRow input{flex:1;-webkit-appearance:none;height:5px;border-radius:99px;background:rgba(255,255,255,.9);outline:none}
.volRow input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 2px 6px #0006}
.pillRow{display:flex;justify-content:center;margin-top:14px}
.pill{background:rgba(255,255,255,.18);border:0;padding:7px 16px;border-radius:99px;font-size:12.5px;color:#fff;display:inline-flex;align-items:center;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid #ffffff10;font-size:13px;gap:10px}
select,input[type=number]{background:#0f0f1e;border:1px solid #ffffff22;color:#fff;border-radius:10px;padding:9px 10px;min-width:135px;text-align:right}
input[type=text]{background:#0f0f1e;border:1px solid #ffffff22;color:#fff;border-radius:10px;padding:9px 10px;flex:1;min-width:0}
.chip{padding:8px 12px;border-radius:99px;border:1px solid #ffffff22;background:#ffffff10;color:#fff;font-size:12px;cursor:pointer}
.flex{display:flex;gap:8px;flex-wrap:wrap}
canvas#wave{width:100%;height:60px;background:#00000050;border-radius:12px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:99;display:none}
</style></head>
<body>
<div class="app">
<div class="top"><div class="logo">Studio<i>Remix</i> 🎧</div><div class="badge">✨ PRO • by Tama-ID</div></div>
<div class="card">
<button class="btn btn-dark" onclick="document.getElementById('audioIn').click()">+ Upload Song</button>
<input type="file" id="audioIn" accept="audio/*" hidden>
<button class="btn btn-grad" id="renderBtn">● Render Video</button>
</div>
<h3>Ekualiser</h3>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>Ekualiser</b><div style="display:flex;gap:10px;align-items:center"><div class="switch on" onclick="this.classList.toggle('on')"></div><span onclick="resetEQ()" style="cursor:pointer">↺</span></div></div>
<div class="eqGrid" id="eq"></div>
<div style="margin-top:12px;display:flex;justify-content:space-between;font-size:11px;color:#94a3b8"><span>Filter:</span><span id="filterLabel">FILTER • NETRAL</span></div>
<div class="filterTrack" id="filterTrack" style="margin-top:8px"><span>LOW PASS</span><span>HIGH PASS</span><div class="filterKnob" id="filterKnob"></div></div>
<div id="filterVal" style="text-align:center;font-size:11px;margin-top:6px">Tengah = Normal • Geser untuk efek</div>
</div>
<h3>Preview iPhone</h3>
<div class="iphone">
<div class="iphoneBg" id="bgBlur"></div>
<div class="cover" onclick="document.getElementById('imgIn').click()"><img id="coverImg"><div class="ph" id="ph">Tap untuk<br>ganti foto</div></div>
<input type="file" id="imgIn" accept="image/*" hidden>
<div class="playerInfo">
<div class="txt">
<div class="title" id="titleView">DJ BANG JONO MASHUP COVER</div>
<div class="artist" id="artistView">Xp!kk...</div>
</div>
<canvas class="vizMini" id="vizMini" width="34" height="20"></canvas>
</div>
<div class="timeRow"><span id="cur">0:00</span><span id="dur">-0:38</span></div>
<div class="progress"><div id="prog"></div></div>
<div class="iphoneControls">
<button id="favBtn" onclick="toggleFav()"><svg id="starSvg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg></button>
<button id="prevBtn"><svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
<button id="playBtn"><svg id="playSvg" width="34" height="34" viewBox="0 0 24 24" fill="white"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg></button>
<button id="nextBtn"><svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
</div>
<div class="volRow"><svg width="18" height="18" viewBox="0 0 24 24" fill="white" opacity=".9"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg><input type="range" id="vol" min="0" max="100" value="90"><svg width="18" height="18" viewBox="0 0 24 24" fill="white" opacity=".9"><path d="M3 9v6h4l5 5V4L7 9H3zM16 8a5 5 0 010 8M18.5 5.5a9 9 0 010 13"/></svg></div>
<div class="pillRow"><button class="pill" onclick="toast('AirPlay - Cari perangkat...')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M5 12l7-7 7 7"/><rect x="2" y="14" width="20" height="6" rx="2"/></svg> AirPlay</button></div>
</div>
<div class="card" style="margin-top:14px">
<div class="row"><label>Judul Lagu</label><input type="text" id="titleIn" value="DJ BANG JONO MASHUP COVER"></div>
<div class="row"><label>Nama Artist</label><input type="text" id="artistIn" value="Xp!kk..."></div>
<canvas id="wave"></canvas>
<div class="flex" style="margin-top:10px"><button class="chip" onclick="playPart()">▶ Putar Bagian</button><button class="chip" onclick="setStart()">Mulai di sini</button><button class="chip" onclick="setEnd()">Akhir di sini</button></div>
<div class="row"><label>Mulai (detik)</label><input type="number" id="startIn" value="0"></div>
<div class="row"><label>Sampai (detik)</label><input type="number" id="endIn" value="30"></div>
</div>
<h3>Pengaturan Video</h3>
<div class="card">
<div class="row"><label>Resolusi</label><select><option>480p</option><option selected>720p (HD)</option><option>1080p</option></select></div>
<div class="row"><label>Orientasi</label><select><option>Potret (9:16)</option><option>Lanskap (16:9)</option></select></div>
<div class="row"><label>FPS</label><select><option>24</option><option selected>30</option><option>60</option></select></div>
</div>
<h3>Efek Suara</h3>
<div class="card">
<div class="row"><label>Kecepatan</label><select id="speed" onchange="setSpeed()"><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option></select></div>
<div class="row"><label>Reverb</label><select><option>Mati</option><option>Ruangan</option><option>Hall</option></select></div>
</div>
<p style="text-align:center;font-size:11px;color:#64748b;margin-top:18px">StudioRemix • by Tama-ID</p>
</div>
<div class="toast" id="toast"></div>
<script>
let audioCtx,srcNode,filters=[],gainNode,analyser,audioEl=new Audio(),lowpass,highpass,isFav=false,isPlaying=false;
const freqs=[60,150,400,1000,2000,4000,8000,16000];
const eqDiv=document.getElementById('eq');
freqs.forEach((f,i)=>{let d=document.createElement('div');d.className='eqCol';d.innerHTML=`<span id="eqVal${i}">+0,0</span><input type="range" min="-12" max="12" step="0.5" value="0" oninput="setEQ(${i},this.value)"><b>${f>=1000?f/1000+'K':f}</b>`;eqDiv.appendChild(d)});
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}
function toggleFav(){isFav=!isFav;document.getElementById('starSvg').setAttribute('fill',isFav?'white':'none');toast(isFav?'Ditambah ke favorit':'Dihapus dari favorit')}
function initAudio(){if(audioCtx)return;audioCtx=new (window.AudioContext||window.webkitAudioContext)();srcNode=audioCtx.createMediaElementSource(audioEl);analyser=audioCtx.createAnalyser();analyser.fftSize=256;gainNode=audioCtx.createGain();gainNode.gain.value=.9;lowpass=audioCtx.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.value=20000;highpass=audioCtx.createBiquadFilter();highpass.type='highpass';highpass.frequency.value=20;let last=srcNode;last.connect(lowpass);last=lowpass;last.connect(highpass);last=highpass;freqs.forEach(f=>{let b=audioCtx.createBiquadFilter();b.type='peaking';b.frequency.value=f;b.Q.value=1;filters.push(b);last.connect(b);last=b});last.connect(gainNode);gainNode.connect(analyser);analyser.connect(audioCtx.destination)}
function applyFilter(pos){if(!audioCtx)return;if(pos<-5){let t=Math.abs(pos)/100;lowpass.frequency.value=20000*Math.pow(0.02,t);highpass.frequency.value=20;document.getElementById('filterLabel').textContent='FILTER • LOW PASS';document.getElementById('filterVal').textContent='LOW PASS - Mendem, bass doang'}else if(pos>5){let t=pos/100;highpass.frequency.value=20*Math.pow(50,t);lowpass.frequency.value=20000;document.getElementById('filterLabel').textContent='FILTER • HIGH PASS';document.getElementById('filterVal').textContent='HIGH PASS - Bass hilang, cempreng'}else{lowpass.frequency.value=20000;highpass.frequency.value=20;document.getElementById('filterLabel').textContent='FILTER • NETRAL';document.getElementById('filterVal').textContent='Tengah = Normal'}}
function setEQ(i,v){document.getElementById('eqVal'+i).textContent=(v>=0?'+':'')+Number(v).toFixed(1).replace('.',',');if(filters[i])filters[i].gain.value=Number(v)}
function resetEQ(){document.querySelectorAll('#eq input').forEach((e,i)=>{e.value=0;setEQ(i,0)});applyFilter(0);document.getElementById('filterKnob').style.left='50%'}
function setSpeed(){audioEl.playbackRate=parseFloat(document.getElementById('speed').value)}
document.getElementById('audioIn').onchange=e=>{let f=e.target.files[0];if(!f)return;audioEl.src=URL.createObjectURL(f);initAudio();document.getElementById('titleIn').value=f.name.replace('.mp3','');syncTitle();audioEl.onloadedmetadata=()=>{document.getElementById('dur').textContent='-'+fmt(audioEl.duration);document.getElementById('endIn').value=Math.min(30,Math.floor(audioEl.duration))};toast('Lagu dimuat')};
document.getElementById('imgIn').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);let img=document.getElementById('coverImg');img.src=u;img.style.display='block';document.getElementById('ph').style.display='none';document.getElementById('bgBlur').style.backgroundImage=`url(${u})`};
function syncTitle(){document.getElementById('titleView').textContent=document.getElementById('titleIn').value;document.getElementById('artistView').textContent=document.getElementById('artistIn').value}
document.getElementById('titleIn').oninput=syncTitle;document.getElementById('artistIn').oninput=syncTitle;
function updatePlayIcon(){document.getElementById('playSvg').innerHTML=isPlaying?'<path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/>':'<path d="M8 5l11 7-11 7z"/>'}
document.getElementById('playBtn').onclick=()=>{initAudio();audioCtx.resume();isPlaying=!isPlaying;if(isPlaying)audioEl.play();else audioEl.pause();updatePlayIcon()};
document.getElementById('prevBtn').onclick=()=>audioEl.currentTime=Math.max(0,audioEl.currentTime-10);
document.getElementById('nextBtn').onclick=()=>audioEl.currentTime=Math.min(audioEl.duration||0,audioEl.currentTime+10);
document.getElementById('vol').oninput=e=>{if(gainNode)gainNode.gain.value=e.target.value/100};
audioEl.ontimeupdate=()=>{document.getElementById('cur').textContent=fmt(audioEl.currentTime);if(audioEl.duration){document.getElementById('prog').style.width=(audioEl.currentTime/audioEl.duration*100)+'%';document.getElementById('dur').textContent='-'+fmt(audioEl.duration-audioEl.currentTime)}};
function fmt(s){if(!s||isNaN(s))return '0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function setStart(){document.getElementById('startIn').value=Math.floor(audioEl.currentTime)}
function setEnd(){document.getElementById('endIn').value=Math.floor(audioEl.currentTime)}
function playPart(){initAudio();audioEl.currentTime=Number(document.getElementById('startIn').value||0);audioEl.play();isPlaying=true;updatePlayIcon()}
let mini=document.getElementById('vizMini'),mctx=mini.getContext('2d');
function drawMini(){requestAnimationFrame(drawMini);mctx.clearRect(0,0,34,20);let d=new Uint8Array(64);if(analyser)analyser.getByteFrequencyData(d);else for(let i=0;i<64;i++)d[i]=Math.random()*25;for(let i=0;i<4;i++){let h=4+d[i*10]/10;let x=3+i*9;mctx.fillStyle='#fff';mctx.beginPath();mctx.roundRect(x,20-h,5,h,3);mctx.fill()}}
drawMini();
let knob=document.getElementById('filterKnob'),track=document.getElementById('filterTrack'),drag=false;
function moveFilter(e){let r=track.getBoundingClientRect();let x=Math.max(14,Math.min(r.width-42,e.clientX-r.left));knob.style.left=x+'px';let pos=((x-14)/(r.width-56)-0.5)*200;applyFilter(pos)}
knob.onpointerdown=e=>{drag=true;knob.setPointerCapture(e.pointerId)};track.onpointerdown=e=>{drag=true;moveFilter(e)};window.onpointermove=e=>{if(drag)moveFilter(e)};window.onpointerup=()=>drag=false;
document.getElementById('renderBtn').onclick=()=>toast('Upload dulu lagunya bung!');
</script></body></html>
